<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Roadmap Clock · Exam HQ 2027</title>
<style>
:root{color-scheme:dark;--bg:#050505;--panel:#111;--ink:#e7e7e7;--muted:#777;--line:#242424;--accent:#cfcfcf}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:25px 18px;background:radial-gradient(ellipse at 50% 36%,#131313 0,transparent 56%),#050505}
main{width:min(100%,700px);text-align:center}.brand{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#666;font-weight:650;margin-bottom:26px}
.clock{display:flex;justify-content:center;align-items:center;gap:clamp(9px,3vw,20px);width:100%}
.group{position:relative;display:flex;align-items:center;justify-content:center;width:min(43vw,310px);height:clamp(120px,34vw,210px);background:linear-gradient(180deg,#111 0%,#151515 50%,#111 51%,#101010 100%);border:1px solid #1a1a1a;border-radius:clamp(12px,3vw,20px);box-shadow:0 16px 40px #0009,inset 0 1px #ffffff08;overflow:hidden}
.group:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#050505;box-shadow:0 1px #ffffff08}
.digits{font-size:clamp(82px,24vw,164px);font-weight:760;line-height:.9;letter-spacing:-.08em;font-variant-numeric:tabular-nums;color:#cfcfcf;text-shadow:0 2px 1px #fff2,0 -2px 1px #0008;transform:translateX(-.025em)}
.colon{font-size:clamp(35px,10vw,68px);font-weight:700;color:#aaa;line-height:1;animation:pulse 1s steps(2,start) infinite}
@keyframes pulse{to{opacity:.25}}
.lower{display:flex;align-items:center;justify-content:space-between;max-width:min(88vw,630px);margin:10px auto 0;color:#777;font-size:12px;letter-spacing:.13em;text-transform:uppercase}
.period{font-weight:750;color:#aaa;letter-spacing:.1em}.zone{font-size:10px;color:#555}
.next{max-width:590px;margin:clamp(42px,11vh,78px) auto 0;text-align:left;border-top:1px solid #222;padding:21px 4px 0}
.kicker{font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:#666;font-weight:700}
.title{font-size:clamp(23px,5vw,36px);letter-spacing:-.035em;line-height:1.15;margin:9px 0 5px;font-weight:650;color:#ededed}
.detail{font-size:14px;color:#858585}
.countdown{display:flex;gap:9px;margin-top:20px}
.unit{min-width:65px;padding:9px 12px;background:#101010;border:1px solid #202020;border-radius:9px;text-align:center}
.unit b{font-size:22px;line-height:1.15;display:block;font-variant-numeric:tabular-nums;color:#dedede}
.unit span{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#666}
.foot{font-size:10px;color:#4d4d4d;margin-top:22px}
@media(max-width:420px){.clock{gap:8px}.group{height:clamp(105px,34vw,142px);border-radius:12px}.digits{font-size:clamp(78px,23vw,105px)}.countdown{gap:5px}.unit{min-width:0;flex:1;padding:8px 4px}.unit b{font-size:19px}}
@media(prefers-reduced-motion:reduce){.colon{animation:none}}
</style>
</head>
<body>
<main>
  <div class="brand">Exam HQ · Roadmap Clock</div>
  <section aria-label="Current time in India">
    <div class="clock">
      <div class="group"><span class="digits" id="hours">12</span></div>
      <span class="colon" aria-hidden="true">:</span>
      <div class="group"><span class="digits" id="minutes">00</span></div>
    </div>
    <div class="lower"><span class="period" id="period">AM</span><span class="zone">India Standard Time · IST</span></div>
  </section>
  <section class="next" aria-live="polite">
    <div class="kicker" id="kind">Coming up</div>
    <div class="title" id="title">Loading the next milestone…</div>
    <div class="detail" id="detail"></div>
    <div class="countdown" id="countdown"></div>
    <div class="foot">Next milestone from your 8 Nov 2026 – 31 May 2027 roadmap</div>
  </section>
</main>
<script>
(function(){
  var events=[
    {at:"2026-11-08T00:00:00+05:30",kind:"Next roadmap phase",title:"Foundation & syllabus completion",detail:"Phase 1 begins · 8 November 2026"},
    {at:"2027-01-01T00:00:00+05:30",kind:"Next roadmap phase",title:"Entrance sprint & board transition",detail:"Phase 2 begins · 1 January 2027"},
    {at:"2027-01-20T00:00:00+05:30",kind:"Entrance exam",title:"JEE Main · Session 1",detail:"Official exam window · 20–24 and 28 January"},
    {at:"2027-02-16T00:00:00+05:30",kind:"CBSE board exam",title:"Physics · Class XII",detail:"16 February 2027"},
    {at:"2027-02-27T00:00:00+05:30",kind:"CBSE board exam",title:"Chemistry · Class XII",detail:"27 February 2027"},
    {at:"2027-03-05T00:00:00+05:30",kind:"CBSE board exam",title:"English Core · Class XII",detail:"5 March 2027"},
    {at:"2027-03-09T00:00:00+05:30",kind:"CBSE board exam",title:"Mathematics · Class XII",detail:"9 March 2027"},
    {at:"2027-03-31T00:00:00+05:30",kind:"CBSE board exam",title:"Computer Science · Class XII",detail:"Final listed subject paper · 31 March 2027"},
    {at:"2027-04-02T00:00:00+05:30",kind:"Entrance exam",title:"JEE Main · Session 2",detail:"Official exam window · 2–7 April 2027"},
    {at:"2027-05-01T00:00:00+05:30",kind:"Next roadmap phase",title:"BITSAT & admissions follow-through",detail:"May phase begins · BITSAT 2027 dates are unconfirmed"},
    {at:"2027-06-01T00:00:00+05:30",kind:"Roadmap finish",title:"Roadmap complete",detail:"31 May 2027"}
  ];
  var formatter=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Kolkata",hour:"2-digit",minute:"2-digit",hour12:true});
  function pad(n){return String(n).padStart(2,"0")}
  function draw(){
    var now=new Date(),parts=formatter.formatToParts(now),hour="12",minute="00",period="AM";
    parts.forEach(function(p){if(p.type==="hour")hour=p.value;if(p.type==="minute")minute=p.value;if(p.type==="dayPeriod")period=p.value.toUpperCase()});
    document.getElementById("hours").textContent=hour;document.getElementById("minutes").textContent=minute;document.getElementById("period").textContent=period;
    var next=null;for(var i=0;i<events.length;i++){if(new Date(events[i].at).getTime()>now.getTime()){next=events[i];break}}
    var kind=document.getElementById("kind"),title=document.getElementById("title"),detail=document.getElementById("detail"),box=document.getElementById("countdown");
    if(!next){kind.textContent="Roadmap complete";title.textContent="You made it to the finish.";detail.textContent="The roadmap ended on 31 May 2027.";box.innerHTML="";return}
    kind.textContent=next.kind;title.textContent=next.title;detail.textContent=next.detail;
    var sec=Math.max(0,Math.floor((new Date(next.at).getTime()-now.getTime())/1000)),days=Math.floor(sec/86400);sec%=86400;var hrs=Math.floor(sec/3600);sec%=3600;var mins=Math.floor(sec/60);sec%=60;
    box.innerHTML='<div class="unit"><b>'+days+'</b><span>Days</span></div><div class="unit"><b>'+pad(hrs)+'</b><span>Hours</span></div><div class="unit"><b>'+pad(mins)+'</b><span>Minutes</span></div><div class="unit"><b>'+pad(sec)+'</b><span>Seconds</span></div>';
  }
  draw();setInterval(draw,1000);
})();
</script>
</body>
</html>
