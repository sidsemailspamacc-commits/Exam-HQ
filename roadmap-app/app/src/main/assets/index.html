<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505"><title>Exam HQ · Schedule Clock</title>
<style>
:root{color-scheme:dark;--bg:#050505;--panel:#101010;--line:#252525;--ink:#e7e7e7;--muted:#898989;--soft:#bdbdbd;--green:#a7d7b6;--gold:#e8c98e}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100dvh}main{height:100dvh;width:100vw;display:grid;grid-template-columns:43% 57%;padding:clamp(14px,3vh,28px) clamp(18px,4vw,56px);gap:clamp(20px,4vw,56px);align-items:center;background:radial-gradient(ellipse at 19% 45%,#141414 0,transparent 44%),#050505}
.clockside{display:flex;flex-direction:column;justify-content:center;min-width:0}.brand{font-size:clamp(8px,1.2vw,11px);letter-spacing:.22em;text-transform:uppercase;color:#606060;font-weight:700;margin-bottom:clamp(13px,3vh,26px)}
.clock{display:flex;align-items:center;gap:clamp(5px,1vw,13px)}.group{height:clamp(82px,22vh,190px);flex:1;min-width:0;display:grid;place-items:center;position:relative;background:linear-gradient(#111 0 49.6%,#050505 49.7%,#111 50.3%,#101010 100%);border:1px solid #202020;border-radius:clamp(10px,1.8vw,18px);box-shadow:0 12px 32px #000b,inset 0 1px #ffffff0a;overflow:hidden}.digits{font-size:clamp(58px,12vw,160px);font-weight:780;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.08em;color:#d1d1d1;text-shadow:0 2px 1px #fff2,0 -2px 1px #0009;transform:translateX(-.04em)}.colon{font-size:clamp(24px,5vw,66px);color:#999;font-weight:750;animation:blink 1s steps(2,start) infinite}@keyframes blink{to{opacity:.25}}
.clockmeta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;color:#696969;font-size:clamp(9px,1.15vw,12px);letter-spacing:.12em;text-transform:uppercase}.period{color:#aaa;font-weight:800}.date{margin-top:clamp(18px,4vh,36px);font-size:clamp(15px,2vw,23px);font-weight:600;letter-spacing:.01em;color:#c7c7c7}.clock-caption{margin-top:3px;color:#5a5a5a;font-size:clamp(9px,1vw,11px)}
.right{display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,3vh,25px);min-width:0;max-height:100%;overflow:hidden}.block{border:1px solid var(--line);background:linear-gradient(145deg,#111,#0b0b0b);border-radius:clamp(12px,2vw,20px);padding:clamp(14px,3vh,25px) clamp(16px,2.5vw,28px);min-width:0}.label{color:#737373;text-transform:uppercase;letter-spacing:.18em;font-size:clamp(8px,1vw,10px);font-weight:750}.status{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-size:clamp(9px,1.05vw,11px);letter-spacing:.13em;text-transform:uppercase;margin-top:11px}.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px #a7d7b699}.task{font-size:clamp(21px,3.6vw,42px);font-weight:680;line-height:1.1;letter-spacing:-.035em;margin-top:7px;color:#eee;overflow-wrap:anywhere}.taskdetail{font-size:clamp(10px,1.3vw,14px);color:#858585;margin-top:7px}.nextline{border-top:1px solid #242424;margin-top:clamp(13px,2.6vh,22px);padding-top:clamp(11px,2.4vh,19px);display:flex;justify-content:space-between;align-items:center;gap:10px}.nextlabel{font-size:clamp(8px,1vw,10px);color:#686868;text-transform:uppercase;letter-spacing:.15em}.nexttask{font-size:clamp(12px,1.6vw,17px);font-weight:650;color:#c5c5c5;margin-top:4px}.nexttime{font-size:clamp(11px,1.3vw,14px);color:#888;white-space:nowrap}
.roadmap{border:1px solid #252525;background:#0c0c0c;border-radius:clamp(12px,2vw,20px);padding:clamp(14px,2.6vh,22px) clamp(16px,2.5vw,28px)}.roadtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.roadbadge{font-size:9px;color:#aaa;border:1px solid #333;border-radius:99px;padding:4px 8px;white-space:nowrap}.roadtitle{font-size:clamp(16px,2.3vw,25px);line-height:1.15;font-weight:650;margin-top:9px;color:#e1e1e1;letter-spacing:-.02em}.roaddetail{font-size:clamp(9px,1.1vw,12px);color:#797979;margin-top:4px}.countdown{display:flex;gap:7px;margin-top:clamp(10px,2vh,16px)}.unit{flex:1;min-width:0;background:#131313;border:1px solid #242424;border-radius:8px;text-align:center;padding:7px 2px}.unit b{font-size:clamp(15px,2.1vw,23px);display:block;line-height:1.12;font-variant-numeric:tabular-nums;color:#ddd}.unit span{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#696969}
@media(max-height:380px){main{padding-top:9px;padding-bottom:9px;gap:16px}.brand{margin-bottom:9px}.group{height:clamp(75px,28vh,106px)}.date{margin-top:10px}.right{gap:8px}.block,.roadmap{padding:10px 14px}.status{margin-top:5px}.nextline{margin-top:8px;padding-top:7px}.countdown{margin-top:7px}}
@media (orientation:portrait){main{grid-template-columns:1fr;grid-template-rows:42% 58%;gap:10px;padding:12px 18px}.clockside{align-items:center}.brand{margin-bottom:8px}.clock{width:min(72vw,380px)}.group{height:clamp(65px,15vh,120px)}.digits{font-size:clamp(56px,18vw,95px)}.date{margin-top:9px}.clock-caption{display:none}.right{gap:9px}.block,.roadmap{padding:10px 14px}.task{font-size:clamp(19px,5.5vw,28px)}.status{margin-top:5px}.nextline{margin-top:8px;padding-top:7px}.countdown{margin-top:7px}}
</style>
</head>
<body><main>
<section class="clockside">
  <div class="brand">Exam HQ · Schedule + Roadmap</div>
  <div class="clock" aria-label="Live India time"><div class="group"><span class="digits" id="hours">12</span></div><span class="colon">:</span><div class="group"><span class="digits" id="minutes">00</span></div></div>
  <div class="clockmeta"><span id="period" class="period">AM</span><span>India Standard Time</span></div>
  <div class="date" id="date">Today</div><div class="clock-caption">Live clock · IST</div>
</section>
<section class="right">
  <article class="block">
    <div class="label">Your schedule · right now</div>
    <div class="status"><span class="dot"></span><span id="status">Checking schedule</span></div>
    <div class="task" id="task">Loading…</div>
    <div class="taskdetail" id="taskdetail"></div>
    <div class="nextline"><div><div class="nextlabel" id="nextlabel">Up next</div><div class="nexttask" id="nexttask">—</div></div><div class="nexttime" id="nexttime"></div></div>
  </article>
  <article class="roadmap">
    <div class="roadtop"><div class="label">Closest roadmap milestone</div><div class="roadbadge" id="roadbadge">UP NEXT</div></div>
    <div class="roadtitle" id="roadtitle">Loading…</div><div class="roaddetail" id="roaddetail"></div>
    <div class="countdown" id="countdown"></div>
  </article>
</section>
</main>
<script>
(function(){
var weekday=[
 {s:"05:30",e:"05:45",n:"Wake up & get ready",d:"Start the morning"},
 {s:"05:45",e:"06:15",n:"Morning tuition test",d:""},
 {s:"06:15",e:"07:00",n:"BITSAT practice",d:"Rotate Physics, Chemistry and Mathematics"},
 {s:"07:00",e:"07:40",n:"Breakfast & get ready for school",d:""},
 {s:"07:40",e:"08:00",n:"Travel to school",d:""},
 {s:"08:00",e:"16:00",n:"School",d:"Includes lunch and breaks"},

 {s:"16:30",e:"17:00",n:"Rest & freshen up",d:""},
 {s:"17:00",e:"18:00",n:"Regular tuition",d:""},
 {s:"18:00",e:"18:40",n:"Board exam preparation",d:""},
 {s:"18:40",e:"19:00",n:"Snack & get ready for Physics tuition",d:""},
 {s:"19:00",e:"19:10",n:"Travel / get settled",d:""},
 {s:"19:10",e:"21:00",n:"Physics tuition",d:"Monday, Tuesday and Friday"},
 {s:"21:00",e:"21:30",n:"Dinner",d:""},
 {s:"21:30",e:"21:45",n:"Relax & freshen up",d:""},
 {s:"21:45",e:"22:30",n:"Pack school bag & prepare for tomorrow",d:""}
];
var midweek=[
 {s:"05:30",e:"05:45",n:"Wake up & get ready",d:""},
 {s:"05:45",e:"06:15",n:"Morning tuition test",d:""},
 {s:"06:15",e:"07:00",n:"BITSAT practice",d:"Rotate Physics, Chemistry and Mathematics"},
 {s:"07:00",e:"07:40",n:"Breakfast & get ready for school",d:""},
 {s:"07:40",e:"08:00",n:"Travel to school",d:""},
 {s:"08:00",e:"16:00",n:"School",d:"Includes lunch and breaks"},
 {s:"16:00",e:"16:30",n:"Travel home & evening snack",d:""},
 {s:"16:30",e:"17:00",n:"Rest & freshen up",d:""},
 {s:"17:00",e:"18:00",n:"Regular tuition",d:""},
 {s:"18:00",e:"19:15",n:"Board study",d:""},
 {s:"19:15",e:"19:30",n:"Short break",d:""},
 {s:"19:30",e:"20:10",n:"Homework, NCERT questions or revision",d:""},
 {s:"20:10",e:"20:15",n:"Wash up / get dinner ready",d:""},
 {s:"20:15",e:"20:45",n:"Dinner",d:""},
 {s:"20:45",e:"21:00",n:"Clean up & relax",d:""},
 {s:"21:00",e:"21:45",n:"Free time",d:""}
];
var weekend=[
 {s:"05:30",e:"06:00",n:"Wake up, wash up & hydrate",d:""},
 {s:"06:00",e:"07:30",n:"Deep board study",d:"Saturday: Physics · Sunday: Mathematics"},
 {s:"07:30",e:"08:15",n:"Breakfast & get ready",d:""},
 {s:"08:15",e:"09:15",n:"BITSAT MCQs",d:"Saturday: Chemistry · Sunday: mixed PCM"},
 {s:"09:15",e:"09:45",n:"Break & snack",d:""},
 {s:"09:45",e:"11:15",n:"Board prep",d:"NCERT, derivations and written answers"},
 {s:"11:15",e:"12:00",n:"English or BITSAT English & Logical Reasoning",d:""},

];
var milestones=[
 {at:"2026-11-08T00:00:00+05:30",kind:"PHASE 01",title:"Foundation & syllabus completion",detail:"Phase begins · 8 November 2026"},
 {at:"2027-01-01T00:00:00+05:30",kind:"PHASE 02",title:"Entrance sprint & board transition",detail:"Phase begins · 1 January 2027"},
 {at:"2027-01-20T00:00:00+05:30",kind:"JEE MAIN",title:"Session 1",detail:"Exam window · 20–24 and 28 January 2027"},

 {at:"2027-03-31T00:00:00+05:30",kind:"CBSE BOARDS",title:"Computer Science · Class XII",detail:"Final listed subject paper · 31 March"},

 {at:"2027-05-01T00:00:00+05:30",kind:"PHASE 05",title:"BITSAT & admissions follow-through",detail:"May phase · BITSAT 2027 exam dates unconfirmed"},
 {at:"2027-06-01T00:00:00+05:30",kind:"ROADMAP END",title:"Roadmap complete",detail:"31 May 2027"}
];
var clockFmt=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Kolkata",hour:"2-digit",minute:"2-digit",hour12:true});
var dateFmt=new Intl.DateTimeFormat("en-IN",{timeZone:"Asia/Kolkata",weekday:"long",day:"numeric",month:"long"});
var weekFmt=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Kolkata",weekday:"short"});
function p2(x){return String(x).padStart(2,"0")}
function minutes(s){var q=s.split(":");return Number(q[0])*60+Number(q[1])}
function tick(){
 var now=new Date(),parts=clockFmt.formatToParts(now),h="12",m="00",period="AM";
 parts.forEach(function(x){if(x.type==="hour")h=x.value;if(x.type==="minute")m=x.value;if(x.type==="dayPeriod")period=x.value.toUpperCase()});
 document.getElementById("hours").textContent=h;document.getElementById("minutes").textContent=m;document.getElementById("period").textContent=period;document.getElementById("date").textContent=dateFmt.format(now);
 var day=weekFmt.format(now),list=(day==="Sat"||day==="Sun")?weekend:(day==="Wed"||day==="Thu"?midweek:weekday),mins=Number(clockFmt.formatToParts(now).find(function(x){return x.type==="hour"}).value)%12,amp=period;mins=(Number(h)%12+(amp==="PM"?12:0))*60+Number(m);
 if(day==="Wed")list[9].d="Wednesday: Mathematics";if(day==="Thu")list[9].d="Thursday: Chemistry";
 var active=null,next=null;
 for(var i=0;i<list.length;i++){if(mins>=minutes(list[i].s)&&mins<minutes(list[i].e)){active=list[i];next=list[i+1]||null;break}if(minutes(list[i].s)>mins&&!next)next=list[i]}
 var status=document.getElementById("status");
 if(active){status.textContent="Happening now";document.getElementById("task").textContent=active.n;document.getElementById("taskdetail").textContent=active.s+"–"+active.e+(active.d?" · "+active.d:"");}
 else if(next){status.textContent="Between blocks · up next";document.getElementById("task").textContent=next.n;document.getElementById("taskdetail").textContent="Starts at "+next.s+(next.d?" · "+next.d:"");}
 else{status.textContent="No more scheduled blocks";document.getElementById("task").textContent=mins>=22*60+30?"Wind down & sleep":"Free time";document.getElementById("taskdetail").textContent="Your planned schedule is complete for today."}
 document.getElementById("nextlabel").textContent=active?"Up next":"Schedule status";
 document.getElementById("nexttask").textContent=active&&next?next.n:(active?"No further block today":(next?"Next scheduled block":"End of today’s schedule"));
 document.getElementById("nexttime").textContent=active&&next?next.s:(next?next.s:"");
 var target=null;for(var j=0;j<milestones.length;j++){if(new Date(milestones[j].at).getTime()>now.getTime()){target=milestones[j];break}}
 if(!target){document.getElementById("roadbadge").textContent="COMPLETE";document.getElementById("roadtitle").textContent="You reached the end.";document.getElementById("roaddetail").textContent="The roadmap ended 31 May 2027.";document.getElementById("countdown").innerHTML="";return}
 document.getElementById("roadbadge").textContent=target.kind;document.getElementById("roadtitle").textContent=target.title;document.getElementById("roaddetail").textContent=target.detail;
 var total=Math.max(0,Math.floor((new Date(target.at).getTime()-now.getTime())/1000)),days=Math.floor(total/86400);total%=86400;var hours=Math.floor(total/3600);total%=3600;var mins2=Math.floor(total/60);total%=60;
 document.getElementById("countdown").innerHTML='<div class="unit"><b>'+days+'</b><span>Days</span></div><div class="unit"><b>'+p2(hours)+'</b><span>Hours</span></div><div class="unit"><b>'+p2(mins2)+'</b><span>Minutes</span></div><div class="unit"><b>'+p2(total)+'</b><span>Seconds</span></div>';
}
tick();setInterval(tick,1000);
})();
</script></body></html>
